<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Monolithic NOS versus disaggregated white-box stack</title>
<desc>Left: one vendor supplies every layer. Right: SONiC apps and NOS over SAI, vendor SDK, merchant ASIC and white-box hardware with ONIE.</desc>
<rect width="680" height="490" fill="#ffffff"/>
<g font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">
<text x="170" y="50">Monolithic NOS</text>
<text x="500" y="50">Disaggregated white box</text>
</g>
<rect x="40" y="70" width="260" height="362" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<g font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">
<text x="170" y="96">Routing apps</text>
<text x="170" y="158">Proprietary NOS</text>
<text x="170" y="220">Internal, closed APIs</text>
<text x="170" y="282">Vendor SDK</text>
<text x="170" y="344">ASIC (custom or merchant)</text>
<text x="170" y="406">Vendor-branded hardware</text>
</g>
<g stroke="#993C1D" stroke-width="0.6" stroke-dasharray="4 4">
<line x1="60" y1="127" x2="280" y2="127"/><line x1="60" y1="189" x2="280" y2="189"/><line x1="60" y1="251" x2="280" y2="251"/><line x1="60" y1="313" x2="280" y2="313"/><line x1="60" y1="375" x2="280" y2="375"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<rect x="360" y="70" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="500" y="88" font-size="14" font-weight="600" fill="#085041">Apps as containers</text>
<text x="500" y="106" font-size="12" fill="#0F6E56">bgp, lldp, snmp, telemetry</text>
<rect x="360" y="132" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="500" y="150" font-size="14" font-weight="600" fill="#085041">SONiC on Debian Linux</text>
<text x="500" y="168" font-size="12" fill="#0F6E56">swss, syncd, redis</text>
<rect x="360" y="194" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="500" y="212" font-size="14" font-weight="600" fill="#085041">SAI</text>
<text x="500" y="230" font-size="12" fill="#0F6E56">Open, standard switch API</text>
<rect x="360" y="256" width="280" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="500" y="274" font-size="14" font-weight="600" fill="#3C3489">Vendor SAI + SDK</text>
<text x="500" y="292" font-size="12" fill="#534AB7">Shipped by ASIC vendor</text>
<rect x="360" y="318" width="280" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="500" y="336" font-size="14" font-weight="600" fill="#3C3489">Merchant ASIC</text>
<text x="500" y="354" font-size="12" fill="#534AB7">Broadcom, NVIDIA, Marvell</text>
<rect x="360" y="380" width="280" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="500" y="398" font-size="14" font-weight="600" fill="#444441">White-box hardware + ONIE</text>
<text x="500" y="416" font-size="12" fill="#5F5E5A">Edgecore, Celestica, Accton</text>
</g>
<text x="340" y="466" font-size="12" fill="#5F5E5A" text-anchor="middle">Left: one vendor owns every layer · Right: teal = open source, purple = ASIC vendor, gray = hardware maker</text>
</svg>
