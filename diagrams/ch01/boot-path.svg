<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" font-family="Helvetica, Arial, sans-serif" role="img">
<title>SONiC boot path from power-on to running processes</title>
<desc>Firmware starts GRUB, which boots the SONiC kernel; ONIE is a separate install-only branch. The kernel mounts the read-only image with an overlay and starts systemd. systemd starts database first, loads CONFIG_DB, then swss and syncd together, then bgp, teamd and lldp, then snmp and telemetry. Inside each container supervisord starts the processes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="880" fill="#ffffff"/>
<g font-size="12" fill="#5F5E5A">
<text x="40" y="112">Firmware</text>
<text x="40" y="232">Linux</text>
<text x="40" y="512">Services</text>
<text x="40" y="792">Processes</text>
</g>
<g text-anchor="middle" dominant-baseline="central">
<rect x="150" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="300" y="58" font-size="14" font-weight="600" fill="#444441">Power on: BIOS / UEFI</text>
<text x="300" y="78" font-size="12" fill="#5F5E5A">Starts the boot loader</text>
<rect x="150" y="120" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="300" y="138" font-size="14" font-weight="600" fill="#444441">GRUB (U-Boot on ARM)</text>
<text x="300" y="158" font-size="12" fill="#5F5E5A">Picks default SONiC image</text>
<rect x="500" y="120" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="575" y="138" font-size="14" font-weight="600" fill="#444441">ONIE</text>
<text x="575" y="158" font-size="12" fill="#5F5E5A">Install / rescue</text>
<rect x="150" y="200" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="300" y="218" font-size="14" font-weight="600" fill="#444441">Kernel + initramfs</text>
<text x="300" y="238" font-size="12" fill="#5F5E5A">Read-only image + overlay</text>
<rect x="150" y="280" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="300" y="298" font-size="14" font-weight="600" fill="#085041">systemd</text>
<text x="300" y="318" font-size="12" fill="#0F6E56">Starts services in order</text>
<rect x="150" y="360" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="300" y="378" font-size="14" font-weight="600" fill="#085041">database (Redis)</text>
<text x="300" y="398" font-size="12" fill="#0F6E56">Shared state comes first</text>
<rect x="150" y="440" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="300" y="458" font-size="14" font-weight="600" fill="#085041">Config loaded into CONFIG_DB</text>
<text x="300" y="478" font-size="12" fill="#0F6E56">From config_db.json</text>
<rect x="150" y="520" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="300" y="538" font-size="14" font-weight="600" fill="#085041">swss ⇄ syncd</text>
<text x="300" y="558" font-size="12" fill="#0F6E56">Start and restart together</text>
<rect x="150" y="600" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="300" y="618" font-size="14" font-weight="600" fill="#085041">bgp, teamd, lldp …</text>
<text x="300" y="638" font-size="12" fill="#0F6E56">Need ports to exist</text>
<rect x="150" y="680" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="300" y="698" font-size="14" font-weight="600" fill="#085041">snmp, telemetry …</text>
<text x="300" y="718" font-size="12" fill="#0F6E56">Started a bit later</text>
<rect x="150" y="760" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="300" y="778" font-size="14" font-weight="600" fill="#3C3489">supervisord in each container</text>
<text x="300" y="798" font-size="12" fill="#534AB7">Starts orchagent, bgpd …</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none">
<line x1="452" y1="148" x2="496" y2="148" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="300" y1="96" x2="300" y2="116" marker-end="url(#arrow)"/>
<line x1="300" y1="176" x2="300" y2="196" marker-end="url(#arrow)"/>
<line x1="300" y1="256" x2="300" y2="276" marker-end="url(#arrow)"/>
<line x1="300" y1="336" x2="300" y2="356" marker-end="url(#arrow)"/>
<line x1="300" y1="416" x2="300" y2="436" marker-end="url(#arrow)"/>
<line x1="300" y1="496" x2="300" y2="516" marker-end="url(#arrow)"/>
<line x1="300" y1="576" x2="300" y2="596" marker-end="url(#arrow)"/>
<line x1="300" y1="656" x2="300" y2="676" marker-end="url(#arrow)"/>
<line x1="300" y1="736" x2="300" y2="756" marker-end="url(#arrow)"/>
</g>
<text x="340" y="856" font-size="12" fill="#5F5E5A" text-anchor="middle">Gray: firmware and kernel · Teal: systemd services · Purple: inside containers · Dashed: install only</text>
</svg>
