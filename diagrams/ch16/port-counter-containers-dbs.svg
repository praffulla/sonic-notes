<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="Helvetica, Arial, sans-serif" role="img">
<title>SONiC port counter containers and databases</title>
<desc>swss and syncd containers communicate via sairedis and write to CONFIG_DB, FLEX_COUNTER_DB and COUNTERS_DB in the database container.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#ffffff"/>
<rect x="40" y="30" width="280" height="170" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="60" y="52" font-size="14" font-weight="600" fill="#3C3489">swss container (orchagent)</text>
<g text-anchor="middle" dominant-baseline="central">
<rect x="60" y="66" width="240" height="54" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text x="180" y="85" font-size="14" font-weight="600" fill="#72243E">PortsOrch</text>
<text x="180" y="103" font-size="12" fill="#993556">Port VIDs, counter maps</text>
<rect x="60" y="132" width="240" height="54" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text x="180" y="151" font-size="14" font-weight="600" fill="#72243E">FlexCounterOrch</text>
<text x="180" y="169" font-size="12" fill="#993556">Reacts to CONFIG_DB</text>
</g>
<rect x="360" y="30" width="280" height="170" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="380" y="52" font-size="14" font-weight="600" fill="#085041">syncd container</text>
<g text-anchor="middle" dominant-baseline="central">
<rect x="380" y="66" width="240" height="54" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="500" y="85" font-size="14" font-weight="600" fill="#27500A">FlexCounter (port group)</text>
<text x="500" y="103" font-size="12" fill="#3B6D11">Polls every 1000 ms</text>
<rect x="380" y="132" width="240" height="54" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="500" y="151" font-size="14" font-weight="600" fill="#27500A">Vendor SAI / SDK</text>
<text x="500" y="169" font-size="12" fill="#3B6D11">Reads hardware stats</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none">
<line x1="322" y1="115" x2="356" y2="115" marker-end="url(#arrow)"/>
<line x1="180" y1="202" x2="180" y2="226" marker-end="url(#arrow)"/>
<line x1="500" y1="202" x2="500" y2="226" marker-end="url(#arrow)"/>
</g>
<rect x="40" y="230" width="600" height="342" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="60" y="252" font-size="14" font-weight="600" fill="#444441">database container (redis)</text>
<g fill="#ffffff" stroke="#888780" stroke-width="0.8">
<rect x="60" y="266" width="560" height="62" rx="8"/>
<rect x="60" y="340" width="560" height="100" rx="8"/>
<rect x="60" y="452" width="560" height="100" rx="8"/>
</g>
<g font-size="14" font-weight="600" fill="#2C2C2A">
<text x="76" y="290">CONFIG_DB</text>
<text x="76" y="382">FLEX_COUNTER_DB</text>
<text x="76" y="494">COUNTERS_DB</text>
</g>
<g font-size="12" fill="#5F5E5A">
<text x="76" y="310">db 4 · written by CLI</text>
<text x="76" y="400">db 5 · written by syncd</text>
<text x="76" y="512">db 2 · PortsOrch + syncd</text>
</g>
<g font-size="12" fill="#2C2C2A" font-family="Menlo, Consolas, monospace">
<text x="250" y="290">FLEX_COUNTER_TABLE|PORT</text>
<text x="250" y="362">FLEX_COUNTER_GROUP_TABLE:</text>
<text x="250" y="404">FLEX_COUNTER_TABLE:...:&lt;Et1 VID&gt;</text>
<text x="250" y="474">COUNTERS_PORT_NAME_MAP</text>
<text x="250" y="516">COUNTERS:&lt;Et1 VID&gt;</text>
</g>
<g font-size="12" fill="#5F5E5A">
<text x="250" y="310">FLEX_COUNTER_STATUS = enable (steps 9–10)</text>
<text x="250" y="380">PORT_STAT_COUNTER: 1000 ms · READ · disable → enable</text>
<text x="250" y="422">PORT_COUNTER_ID_LIST = SAI_PORT_STAT_…</text>
<text x="250" y="492">Et1 → &lt;Et1 VID&gt; (PortsOrch, steps 4–8)</text>
<text x="250" y="534">SAI_PORT_STAT_IF_IN_OCTETS … (syncd, each poll)</text>
</g>
</svg>
